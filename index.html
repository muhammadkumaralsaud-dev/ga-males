<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Males - Pengelola Soal</title>
    <!-- Tailwind CSS untuk Desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel untuk menjalankan kode React di browser -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Komponen Ikon Sederhana (menggunakan SVG karena Lucide React berbeda dengan Lucide Web)
        const Icon = ({ name, size = 20, className = "" }) => {
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzlKNbC7dT9xVjd-9nQIq-eQDID10s8f_tK1IQVLWAxP41hs4X3l3-yLTaA08kDp8spGQ/exec';
            
            const [questions, setQuestions] = useState([]);
            const [subjects, setSubjects] = useState(['Umum']);
            const [activeSubject, setActiveSubject] = useState('Semua');
            const [searchQuery, setSearchQuery] = useState('');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isDeleteModalOpen, setIsDeleteModalOpen] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [isQuizMode, setIsQuizMode] = useState(false);
            const [showAnswer, setShowAnswer] = useState({});
            const [isLoading, setIsLoading] = useState(false);
            const [syncStatus, setSyncStatus] = useState('idle'); 
            const [targetId, setTargetId] = useState(null);

            const [formData, setFormData] = useState({ id: null, text: '', answer: '', subject: '' });

            useEffect(() => {
                const savedData = localStorage.getItem('no-males-questions');
                const savedSubjects = localStorage.getItem('no-males-subjects');
                if (savedData) setQuestions(JSON.parse(savedData));
                if (savedSubjects) setSubjects(JSON.parse(savedSubjects));
                loadFromSheets();
            }, []);

            useEffect(() => {
                localStorage.setItem('no-males-questions', JSON.stringify(questions));
                localStorage.setItem('no-males-subjects', JSON.stringify(subjects));
                // Trigger Lucide icons refresh
                if (window.lucide) window.lucide.createIcons();
            }, [questions, subjects, isSidebarOpen, isModalOpen, isDeleteModalOpen]);

            const syncWithGoogleSheets = async (data) => {
                setSyncStatus('loading');
                try {
                    await fetch(SHEET_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'sync', data: data })
                    });
                    setSyncStatus('success');
                    setTimeout(() => setSyncStatus('idle'), 3000);
                } catch (error) {
                    setSyncStatus('error');
                }
            };

            const loadFromSheets = async () => {
                setIsLoading(true);
                try {
                    const response = await fetch(SHEET_URL);
                    const data = await response.json();
                    if (data && Array.isArray(data)) {
                        setQuestions(data);
                        const cloudSubjects = [...new Set(data.map(q => q.subject).filter(s => s))];
                        setSubjects(prev => [...new Set(['Umum', ...prev, ...cloudSubjects])]);
                    }
                } catch (error) {
                    console.error("Gagal ambil data:", error);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSaveQuestion = () => {
                if (!formData.text || !formData.answer || !formData.subject) return;
                let updated;
                const subj = formData.subject.trim();
                if (!subjects.includes(subj)) setSubjects([...subjects, subj]);

                if (formData.id) {
                    updated = questions.map(q => q.id === formData.id ? { ...formData, subject: subj, updatedAt: new Date().toISOString() } : q);
                } else {
                    const newItem = { ...formData, subject: subj, id: Date.now().toString(), createdAt: new Date().toISOString() };
                    updated = [newItem, ...questions];
                }
                setQuestions(updated);
                setIsModalOpen(false);
                syncWithGoogleSheets(updated);
            };

            const confirmDelete = () => {
                const filtered = questions.filter(q => q.id !== targetId);
                setQuestions(filtered);
                syncWithGoogleSheets(filtered);
                setIsDeleteModalOpen(false);
            };

            const filteredQuestions = useMemo(() => {
                return questions.filter(q => {
                    const matchesSearch = (q.text || '').toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesSubject = activeSubject === 'Semua' || q.subject === activeSubject;
                    return matchesSearch && matchesSubject;
                });
            }, [questions, searchQuery, activeSubject]);

            return (
                <div className={`min-h-screen transition-colors duration-300 flex flex-col lg:flex-row ${isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
                    {/* Sidebar Mobile Overlay */}
                    {isSidebarOpen && <div className="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm lg:hidden" onClick={() => setIsSidebarOpen(false)}></div>}

                    {/* Sidebar */}
                    <aside className={`fixed lg:sticky top-0 left-0 z-50 h-full lg:h-screen w-72 bg-inherit border-r transition-transform duration-300 transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} ${isDarkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                        <div className="p-6 flex flex-col h-full">
                            <div className="flex items-center justify-between mb-8">
                                <div className="flex items-center gap-3">
                                    <div className="bg-indigo-600 p-2 rounded-xl text-white"><Icon name="brain-circuit" /></div>
                                    <h1 className="text-xl font-bold tracking-tight">No <span className="text-indigo-600">Males</span></h1>
                                </div>
                                <button onClick={() => setIsSidebarOpen(false)} className="lg:hidden text-slate-400"><Icon name="chevron-left" size={24} /></button>
                            </div>

                            <nav className="flex-1 overflow-y-auto space-y-1 scrollbar-hide">
                                <h2 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"><Icon name="folder" size={14} /> Folder</h2>
                                <button onClick={() => {setActiveSubject('Semua'); setIsSidebarOpen(false);}} className={`w-full text-left px-4 py-3 rounded-2xl flex justify-between items-center ${activeSubject === 'Semua' ? 'bg-indigo-600 text-white shadow-lg' : 'hover:bg-indigo-50 dark:hover:bg-slate-900 text-slate-500'}`}>
                                    <span>Semua Soal</span>
                                    <span className="text-[10px] bg-black/10 px-1.5 py-0.5 rounded">{questions.length}</span>
                                </button>
                                {subjects.map(s => (
                                    <button key={s} onClick={() => {setActiveSubject(s); setIsSidebarOpen(false);}} className={`w-full text-left px-4 py-3 rounded-2xl flex justify-between items-center ${activeSubject === s ? 'bg-indigo-600 text-white shadow-lg' : 'hover:bg-indigo-50 dark:hover:bg-slate-900 text-slate-500'}`}>
                                        <span className="truncate">{s}</span>
                                        <span className="text-[10px] bg-black/10 px-1.5 py-0.5 rounded">{questions.filter(q => q.subject === s).length}</span>
                                    </button>
                                ))}
                            </nav>
                            
                            <div className="mt-4">
                                {syncStatus !== 'idle' && (
                                    <div className={`p-3 rounded-xl text-[10px] font-bold uppercase flex items-center gap-2 ${syncStatus === 'loading' ? 'bg-blue-100 text-blue-600' : 'bg-emerald-100 text-emerald-600'}`}>
                                        <Icon name={syncStatus === 'loading' ? 'refresh-cw' : 'check'} size={14} className={syncStatus === 'loading' ? 'animate-spin' : ''} />
                                        {syncStatus === 'loading' ? 'Syncing...' : 'Cloud Updated'}
                                    </div>
                                )}
                            </div>
                        </div>
                    </aside>

                    {/* Main */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className={`p-4 md:px-8 border-b flex justify-between items-center ${isDarkMode ? 'bg-slate-950/80 border-slate-800' : 'bg-white/80 border-slate-200'}`}>
                            <button onClick={() => setIsSidebarOpen(true)} className="lg:hidden p-2 rounded-xl bg-slate-100 dark:bg-slate-800"><Icon name="menu" /></button>
                            <h2 className="hidden sm:block font-bold text-indigo-600 uppercase tracking-widest text-sm">{activeSubject}</h2>
                            <div className="flex items-center gap-2">
                                <button onClick={loadFromSheets} className="p-2.5 rounded-xl border dark:border-slate-800"><Icon name="refresh-cw" className={isLoading ? 'animate-spin' : ''} /></button>
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2.5 rounded-xl border dark:border-slate-800"><Icon name={isDarkMode ? 'sun' : 'moon'} /></button>
                                <button onClick={() => {setFormData({id:null, text:'', answer:'', subject:''}); setIsModalOpen(true);}} className="bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-bold shadow-lg shadow-indigo-600/20 flex items-center gap-2"><Icon name="plus" /> <span className="hidden sm:inline">Tambah</span></button>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 scrollbar-hide">
                            <div className="max-w-4xl mx-auto space-y-6">
                                <div className="flex flex-col sm:flex-row gap-4">
                                    <div className="relative flex-1">
                                        <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                                        <input type="text" placeholder="Cari soal..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className={`w-full pl-12 pr-4 py-3.5 rounded-2xl border outline-none focus:ring-2 ring-indigo-500 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`} />
                                    </div>
                                    <button onClick={() => setIsQuizMode(!isQuizMode)} className={`px-8 py-3.5 rounded-2xl font-bold flex items-center justify-center gap-2 border-2 ${isQuizMode ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-indigo-500 text-indigo-500'}`}><Icon name="layout-grid" /> {isQuizMode ? 'Semua' : 'Quiz'}</button>
                                </div>

                                <div className="space-y-4 pb-10">
                                    {filteredQuestions.map(q => (
                                        <div key={q.id} className={`p-6 rounded-[2rem] border group transition-all hover:shadow-xl ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                                            <div className="flex justify-between mb-4">
                                                <span className="text-[10px] font-black px-2 py-1 bg-indigo-100 text-indigo-600 dark:bg-indigo-900/40 dark:text-indigo-400 rounded uppercase">{q.subject}</span>
                                                <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-all">
                                                    <button onClick={() => {setFormData(q); setIsModalOpen(true);}} className="p-2 text-slate-400 hover:text-indigo-500"><Icon name="edit-3" size={18} /></button>
                                                    <button onClick={() => {setTargetId(q.id); setIsDeleteModalOpen(true);}} className="p-2 text-slate-400 hover:text-red-500"><Icon name="trash-2" size={18} /></button>
                                                </div>
                                            </div>
                                            <p className="text-lg font-semibold leading-relaxed mb-6">{q.text}</p>
                                            <div onClick={() => setShowAnswer({...showAnswer, [q.id]: !showAnswer[q.id]})} className={`p-4 rounded-2xl border cursor-pointer ${showAnswer[q.id] || !isQuizMode ? 'bg-emerald-50 border-emerald-100 dark:bg-emerald-900/10 dark:border-emerald-900/50' : 'bg-slate-50 border-transparent dark:bg-slate-950'}`}>
                                                <h4 className="text-[10px] font-black uppercase text-slate-400 flex items-center gap-2">
                                                    <Icon name={showAnswer[q.id] || !isQuizMode ? "check-circle" : "chevron-right"} size={14} /> Kunci Jawaban
                                                </h4>
                                                {(showAnswer[q.id] || !isQuizMode) && <p className="mt-2 font-bold text-emerald-700 dark:text-emerald-300">{q.answer}</p>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
                            <div className={`relative w-full max-w-lg p-8 rounded-[2.5rem] border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white'}`}>
                                <h2 className="text-xl font-bold mb-6">{formData.id ? 'Edit' : 'Tambah'} Soal</h2>
                                <div className="space-y-4">
                                    <input type="text" list="subjects" placeholder="Mata Kuliah..." className="w-full p-4 rounded-xl border dark:bg-slate-950 dark:border-slate-800" value={formData.subject} onChange={e => setFormData({...formData, subject: e.target.value})} />
                                    <datalist id="subjects">{subjects.map(s => <option key={s} value={s}/>)}</datalist>
                                    <textarea rows="3" placeholder="Pertanyaan..." className="w-full p-4 rounded-xl border dark:bg-slate-950 dark:border-slate-800" value={formData.text} onChange={e => setFormData({...formData, text: e.target.value})}></textarea>
                                    <input type="text" placeholder="Jawaban..." className="w-full p-4 rounded-xl border dark:bg-slate-950 dark:border-slate-800" value={formData.answer} onChange={e => setFormData({...formData, answer: e.target.value})} />
                                    <div className="flex gap-2 pt-4">
                                        <button onClick={() => setIsModalOpen(false)} className="flex-1 py-3 font-bold bg-slate-100 dark:bg-slate-800 rounded-xl">Batal</button>
                                        <button onClick={handleSaveQuestion} className="flex-1 py-3 font-bold bg-indigo-600 text-white rounded-xl">Simpan</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Delete */}
                    {isDeleteModalOpen && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
                            <div className={`p-8 rounded-[2rem] border max-w-sm text-center ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white'}`}>
                                <h2 className="text-xl font-bold mb-2">Hapus Soal?</h2>
                                <p className="text-slate-500 mb-6 text-sm">Data akan dihapus permanen dari Cloud.</p>
                                <button onClick={confirmDelete} className="w-full py-3 bg-red-600 text-white rounded-xl font-bold mb-2">Ya, Hapus</button>
                                <button onClick={() => setIsDeleteModalOpen(false)} className="w-full py-3 bg-slate-100 dark:bg-slate-800 rounded-xl font-bold">Batal</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
